# ============================================================
# alembic.ini — KrashiMitra schema migrations
#
# The database URL is deliberately NOT set here; migrations/env.py reads
# DATABASE_URL from the environment (same var the app uses), so the same
# command works locally and on Render without a second place to keep a
# connection string in sync — or leak one into the repo.
# ============================================================

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timestamped revision filenames, so `ls versions/` reads chronologically
# instead of as a pile of opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
