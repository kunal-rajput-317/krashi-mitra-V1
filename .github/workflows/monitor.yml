name: monitor

# External uptime + mandi-data-freshness watch. Runs independently of the app
# a few times a day, so a DOWN site OR a silently-stale price feed is caught
# even when nobody is looking. On a problem it (1) pings Telegram if configured
# and (2) fails the job, so GitHub emails the repo owner as a zero-setup
# backstop. Optional Telegram = instant phone push; add two repo secrets:
#   TELEGRAM_BOT_TOKEN  (from @BotFather)
#   TELEGRAM_CHAT_ID    (your chat id, e.g. via @userinfobot)
# Without them you still get GitHub's Actions-failure email. Fully automatic.

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (keepalive already covers fast downtime)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # The URL is read from the repo, never pinned here. Render has renamed
      # this service twice; the first time, this job was left pointing at the
      # dead host and spent days alerting "site DOWN" while exiting before it
      # ever reached the freshness check — which is how a stalled mandi feed
      # went unnoticed from 29 Jul. One source of truth removes that failure
      # mode for this job and for frontend/_redirects at the same time.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config/backend-origin.txt
          sparse-checkout-cone-mode: false

      - name: Check health + mandi freshness
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          BASE=$(grep -m1 -E '^https?://' config/backend-origin.txt)
          echo "backend: $BASE"

          alert() {
            echo "::error::$1"
            if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
              curl -s --max-time 20 \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT}" \
                --data-urlencode "text=🚨 KrashiMitra: $1" >/dev/null || true
            fi
          }

          # 1) Liveness — retry to ride out Render's ~50s cold start.
          code=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BASE/health" || true)
            [ "$code" = "200" ] && break
            echo "health attempt $i => '$code', retry in 30s"; sleep 30
          done
          if [ "$code" != "200" ]; then
            alert "site DOWN — /health returned '$code' after 3 tries"
            exit 1
          fi
          echo "liveness ok"

          # 1b) The PUBLIC domain — the only address a farmer ever types.
          #
          # Everything above this point talks to the origin directly, so it
          # stays green through an outage farmers cannot see past. That is not
          # hypothetical: on 16 Sep 2026 Netlify's free tier went
          # usage_exceeded and served 503 on every URL of krashimitra.in for
          # hours while Render answered 200 throughout. This job would have
          # reported a healthy site for the whole outage.
          #
          # Checked separately from the origin so the alert can say WHICH half
          # broke — an origin-up/domain-down split is DNS, the CDN or the
          # host in front, and none of those are fixed by looking at Render.
          # /bhav rather than / because a server-rendered route proves the app
          # is really being reached, not just a cached or parked page.
          for url in "https://krashimitra.in/" "https://krashimitra.in/bhav"; do
            pub=""
            for i in 1 2 3; do
              pub=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || true)
              [ "$pub" = "200" ] && break
              echo "public attempt $i for $url => '$pub', retry in 30s"; sleep 30
            done
            if [ "$pub" != "200" ]; then
              alert "PUBLIC SITE DOWN — $url returned '$pub' while the origin ($BASE) is healthy. DNS, Cloudflare or the host in front, not the app."
              exit 1
            fi
          done
          echo "public domain ok"

          # 2) Data freshness — is the mandi feed still updating?
          body=$(curl -s --max-time 60 "$BASE/health/data" || true)
          echo "freshness: $body"
          if printf '%s' "$body" | grep -Eq '"stale"[[:space:]]*:[[:space:]]*true'; then
            age=$(printf '%s' "$body" | grep -Eo '"last_fresh_age_hours"[^,}]*' || true)
            last=$(printf '%s' "$body" | grep -Eo '"last_run_status"[^,}]*' || true)
            alert "mandi prices STALE — no fresh sync recently (${age}; ${last}). Feed/scheduler may be stuck."
            exit 1
          fi

          # 3) Every other feature — weather cache, write-ability, schedulers,
          # KCC, seasonality, mail, push. Same checks the /health page shows a
          # human; here they page us instead. Only "down" alerts — a "warn" is
          # something to look at, not something to wake up for.
          # jq, not grep: group labels and check labels share a key name, so a
          # regex would happily blame "डेटा फ़ीड" for a broken card inside it.
          checks=$(curl -s --max-time 90 "$BASE/health/checks" || true)
          overall=$(printf '%s' "$checks" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          echo "features: $overall"
          if [ "$overall" = "down" ]; then
            broken=$(printf '%s' "$checks" | jq -r \
              '[.groups[].checks[] | select(.status=="down") | .label + " (" + .detail + ")"]
               | join("; ")' 2>/dev/null || true)
            alert "feature DOWN — ${broken:-see /health}. Full page: $BASE/health"
            exit 1
          fi

          echo "all good ✅ — site up, feed fresh, every feature healthy"
