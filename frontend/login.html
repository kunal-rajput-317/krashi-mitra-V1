<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>👤 Login / Profile | KrashiMitra</title>
  <meta name="description" content="KrashiMitra पर login करें — अपनी फसल, जमीन और सलाह सेव करें।" />
  <meta name="robots" content="noindex" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap');

    :root {
      --green-dark:    #1a3c2e;
      --green-mid:     #2d6a4f;
      --green-light:   #52b788;
      --green-pale:    #d8f3dc;
      --amber:         #e9a825;
      --amber-light:   #fef3c7;
      --cream:         #faf7f2;
      --white:         #ffffff;
      --text-dark:     #1a2e1e;
      --text-mid:      #4a6355;
      --text-light:    #8aab96;
      --border:        #ddeee4;
      --shadow:        0 4px 24px rgba(26,60,46,0.10);
      --shadow-lg:     0 8px 40px rgba(26,60,46,0.16);
      --radius:        14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', 'Noto Sans Devanagari', sans-serif;
      background: rgba(26,60,46,0.85);
      color: var(--text-dark);
    }

    /* ══════════════════════════════════════
       MODAL OVERLAY BACKDROP
       (used when embedded in another page)
    ══════════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,60,46,0.80);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: overlayIn 0.2s ease both;
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ══════════════════════════════════════
       MODAL CARD
    ══════════════════════════════════════ */
    .modal-card {
      background: var(--white);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: cardUp 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes cardUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Card header */
    .modal-header {
      background: linear-gradient(135deg, var(--green-dark) 0%, #2d6a4f 100%);
      padding: 28px 28px 22px;
      position: relative;
      text-align: center;
    }
    .modal-header-logo { font-size: 36px; margin-bottom: 10px; }
    .modal-header-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #fff;
      margin-bottom: 4px;
    }
    .modal-header-title span { color: var(--amber); }
    .modal-header-sub {
      font-size: 12.5px;
      color: rgba(255,255,255,0.60);
    }
    .modal-close-btn {
      position: absolute;
      top: 14px; right: 16px;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 50%;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      cursor: pointer;
      color: rgba(255,255,255,0.75);
      transition: background 0.18s;
    }
    .modal-close-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }

    /* Tab switcher */
    .modal-tabs {
      display: flex;
      background: var(--cream);
      border-bottom: 1.5px solid var(--border);
    }
    .modal-tab {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      font-size: 13.5px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      color: var(--text-light);
      transition: color 0.18s, border-bottom 0.18s;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px;
    }
    .modal-tab.active {
      color: var(--green-dark);
      border-bottom-color: var(--green-mid);
    }

    /* ══════════════════════════════════════
       FORM PANELS
    ══════════════════════════════════════ */
    .modal-body { padding: 24px 28px 20px; }

    .modal-panel { display: none; }
    .modal-panel.active { display: block; }

    /* Form groups */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-mid);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'DM Sans', 'Noto Sans Devanagari', sans-serif;
      color: var(--text-dark);
      background: var(--cream);
      outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .form-input:focus {
      border-color: var(--green-light);
      background: var(--white);
    }
    .form-input::placeholder { color: var(--text-light); font-size: 13px; }

    /* Phone input with flag */
    .phone-wrap {
      display: flex;
      gap: 8px;
    }
    .phone-prefix {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--cream);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-mid);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .phone-wrap .form-input { flex: 1; }

    /* OTP row */
    .otp-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .otp-row .form-input { flex: 1; letter-spacing: 4px; text-align: center; font-weight: 700; font-size: 18px; }
    .otp-resend-btn {
      background: none;
      border: none;
      color: var(--green-mid);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      padding: 4px;
      flex-shrink: 0;
    }
    .otp-resend-btn:disabled { color: var(--text-light); cursor: not-allowed; }

    /* Submit button */
    .form-submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--green-mid);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.18s, transform 0.15s;
      box-shadow: 0 3px 12px rgba(45,106,79,0.35);
    }
    .form-submit-btn:hover  { background: var(--green-dark); }
    .form-submit-btn:active { transform: scale(0.97); }
    .form-submit-btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; box-shadow: none; }

    /* Divider */
    .form-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--text-light);
      font-size: 12px;
    }
    .form-divider::before,
    .form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Social login */
    .social-btns { display: flex; gap: 10px; }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      color: var(--text-dark);
    }
    .social-btn:hover { background: var(--green-pale); border-color: var(--green-light); }

    /* Status message */
    .form-status {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      font-family: 'Noto Sans Devanagari', 'DM Sans', sans-serif;
    }
    .form-status.success { background: var(--green-pale); color: var(--green-dark); display: block; }
    .form-status.error   { background: #fef0f0; color: #922b21; display: block; }
    .form-status.info    { background: var(--amber-light); color: #7d5a00; display: block; }

    /* ══════════════════════════════════════
       PROFILE PANEL (logged-in state)
    ══════════════════════════════════════ */
    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--green-pale);
      border: 3px solid var(--green-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      margin: 0 auto 16px;
    }
    .profile-name {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    .profile-phone {
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 20px;
    }
    .profile-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .profile-info-card {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .profile-info-card .pic-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-light); margin-bottom: 4px; }
    .profile-info-card .pic-value { font-size: 14px; font-weight: 600; color: var(--text-dark); font-family: 'Noto Sans Devanagari', 'DM Sans', sans-serif; }

    .profile-action-btns { display: flex; flex-direction: column; gap: 10px; }
    .profile-action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      text-decoration: none;
    }
    .profile-action-btn:hover { background: var(--green-pale); border-color: var(--green-light); }
    .profile-action-btn .pab-arrow { margin-left: auto; color: var(--text-light); }
    .profile-logout-btn {
      width: 100%;
      padding: 13px;
      background: none;
      border: 1.5px solid #f5c6c6;
      border-radius: 12px;
      color: #922b21;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s;
    }
    .profile-logout-btn:hover { background: #fef0f0; }

    /* Footer note */
    .modal-footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      padding: 12px 28px 20px;
      border-top: 1px solid var(--border);
      line-height: 1.6;
    }
    .modal-footer-note a { color: var(--green-mid); text-decoration: none; }

    /* ══════════════════════════════════════
       STANDALONE PAGE (when opened directly)
    ══════════════════════════════════════ */
    body.standalone-mode {
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body.standalone-mode .modal-overlay {
      position: static;
      background: none;
      backdrop-filter: none;
      padding: 0;
    }
  </style>
</head>
<body>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-card" id="modal-card">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-logo">🌾</div>
      <div class="modal-header-title">कृषि <span>मित्र</span></div>
      <div class="modal-header-sub">किसान का डिजिटल साथी</div>
      <button class="modal-close-btn" onclick="closeModal()" title="बंद करें">✕</button>
    </div>

    <!-- Tabs -->
    <div class="modal-tabs" id="modal-tabs">
      <button class="modal-tab active" id="tab-login"   onclick="switchTab('login')">🔐 Login</button>
      <button class="modal-tab"        id="tab-register" onclick="switchTab('register')">✍️ Register</button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- ── LOGIN PANEL ── -->
      <div class="modal-panel active" id="panel-login">

        <!-- Step 1: Phone -->
        <div id="login-step-phone">
          <div class="form-group">
            <label class="form-label">📱 मोबाइल नंबर</label>
            <div class="phone-wrap">
              <div class="phone-prefix">🇮🇳 +91</div>
              <input type="tel" class="form-input" id="login-phone"
                     placeholder="10 अंक का नंबर"
                     maxlength="10"
                     oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
            </div>
          </div>
          <button class="form-submit-btn" onclick="sendOTP('login')">OTP भेजें →</button>
          <div class="form-divider">या</div>
          <div class="social-btns">
            <button class="social-btn" onclick="googleLogin()">
              <span style="font-size:16px;">🌐</span> Google
            </button>
            <button class="social-btn" onclick="guestLogin()">
              <span style="font-size:16px;">👤</span> Guest
            </button>
          </div>
        </div>

        <!-- Step 2: OTP -->
        <div id="login-step-otp" style="display:none">
          <div class="form-group">
            <label class="form-label">🔢 OTP डालें</label>
            <div class="otp-row">
              <input type="tel" class="form-input" id="login-otp"
                     placeholder="6 अंक"
                     maxlength="6"
                     oninput="this.value=this.value.replace(/\D/g,'').slice(0,6); if(this.value.length===6) verifyOTP('login')">
              <button class="otp-resend-btn" id="login-resend-btn" onclick="resendOTP('login')" disabled>
                दोबारा भेजें (<span id="login-resend-timer">30</span>s)
              </button>
            </div>
          </div>
          <button class="form-submit-btn" onclick="verifyOTP('login')">Login करें ✓</button>
          <div style="text-align:center;margin-top:12px;">
            <button style="background:none;border:none;color:var(--text-light);font-size:12px;cursor:pointer;" onclick="backToPhone('login')">← नंबर बदलें</button>
          </div>
        </div>

        <div class="form-status" id="login-status"></div>
      </div>

      <!-- ── REGISTER PANEL ── -->
      <div class="modal-panel" id="panel-register">

        <!-- Step 1: Details -->
        <div id="register-step-details">
          <div class="form-group">
            <label class="form-label">👤 पूरा नाम</label>
            <input type="text" class="form-input" id="register-name"
                   placeholder="जैसे: रामेश्वर सिंह">
          </div>
          <div class="form-group">
            <label class="form-label">📱 मोबाइल नंबर</label>
            <div class="phone-wrap">
              <div class="phone-prefix">🇮🇳 +91</div>
              <input type="tel" class="form-input" id="register-phone"
                     placeholder="10 अंक का नंबर"
                     maxlength="10"
                     oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">📍 राज्य / जिला</label>
            <select class="form-input" id="register-state">
              <option value="">राज्य चुनें</option>
              <option value="UP">Uttar Pradesh</option>
              <option value="MP">Madhya Pradesh</option>
              <option value="RJ">Rajasthan</option>
              <option value="HR">Haryana</option>
              <option value="PB">Punjab</option>
              <option value="BR">Bihar</option>
              <option value="MH">Maharashtra</option>
              <option value="KA">Karnataka</option>
              <option value="GJ">Gujarat</option>
              <option value="OTHER">अन्य</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">🌾 मुख्य फसल</label>
            <select class="form-input" id="register-crop">
              <option value="">फसल चुनें</option>
              <option value="gehu">गेहूँ</option>
              <option value="dhaan">धान</option>
              <option value="ganna">गन्ना</option>
              <option value="sarson">सरसों</option>
              <option value="aloo">आलू</option>
              <option value="other">अन्य</option>
            </select>
          </div>
          <button class="form-submit-btn" onclick="sendOTP('register')">OTP भेजें →</button>
        </div>

        <!-- Step 2: OTP -->
        <div id="register-step-otp" style="display:none">
          <div style="text-align:center;margin-bottom:16px;font-size:14px;color:var(--text-mid);">
            OTP भेजा गया: <strong id="register-phone-display"></strong>
          </div>
          <div class="form-group">
            <label class="form-label">🔢 OTP डालें</label>
            <div class="otp-row">
              <input type="tel" class="form-input" id="register-otp"
                     placeholder="6 अंक"
                     maxlength="6"
                     oninput="this.value=this.value.replace(/\D/g,'').slice(0,6); if(this.value.length===6) verifyOTP('register')">
              <button class="otp-resend-btn" id="register-resend-btn" onclick="resendOTP('register')" disabled>
                दोबारा (<span id="register-resend-timer">30</span>s)
              </button>
            </div>
          </div>
          <button class="form-submit-btn" onclick="verifyOTP('register')">Account बनाएं ✓</button>
          <div style="text-align:center;margin-top:12px;">
            <button style="background:none;border:none;color:var(--text-light);font-size:12px;cursor:pointer;" onclick="backToPhone('register')">← वापस जाएं</button>
          </div>
        </div>

        <div class="form-status" id="register-status"></div>
      </div>

      <!-- ── PROFILE PANEL (shown after login) ── -->
      <div class="modal-panel" id="panel-profile">
        <div class="profile-avatar">👨‍🌾</div>
        <div class="profile-name" id="profile-name-display">—</div>
        <div class="profile-phone" id="profile-phone-display">—</div>

        <div class="profile-info-grid">
          <div class="profile-info-card">
            <div class="pic-label">📍 राज्य</div>
            <div class="pic-value" id="profile-state-display">—</div>
          </div>
          <div class="profile-info-card">
            <div class="pic-label">🌾 फसल</div>
            <div class="pic-value" id="profile-crop-display">—</div>
          </div>
        </div>

        <div class="profile-action-btns">
          <a class="profile-action-btn" href="chat.html">
            💬 AI से पूछें
            <span class="pab-arrow">›</span>
          </a>
          <a class="profile-action-btn" href="khoj.html">
            🔍 कृषि खोज
            <span class="pab-arrow">›</span>
          </a>
          <a class="profile-action-btn" href="mandi.html">
            🏪 मंडी भाव
            <span class="pab-arrow">›</span>
          </a>
        </div>

        <button class="profile-logout-btn" onclick="logout()">🚪 Logout</button>
      </div>

    </div><!-- /.modal-body -->

    <!-- Footer -->
    <div class="modal-footer-note">
      Login करके आप हमारी <a href="#">Privacy Policy</a> और
      <a href="#">Terms of Service</a> से सहमत हैं।<br>
      डेटा 100% सुरक्षित — कभी शेयर नहीं किया जाता।
    </div>

  </div><!-- /.modal-card -->
</div><!-- /.modal-overlay -->

<script>
  // ══════════════════════════════════════
  // USER STATE
  // ══════════════════════════════════════
  let currentUser = JSON.parse(localStorage.getItem('km_user') || 'null');
  let resendTimers = {};

  // ══════════════════════════════════════
  // INIT
  // ══════════════════════════════════════
  (function init() {
    // Detect if opened standalone vs embedded
    if (window.self === window.top && !document.referrer.includes('krashimitra')) {
      document.body.classList.add('standalone-mode');
    }

    if (currentUser) {
      showProfilePanel();
    }
  })();

  // ══════════════════════════════════════
  // TABS
  // ══════════════════════════════════════
  function switchTab(tab) {
    ['login','register'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      document.getElementById(`panel-${t}`).classList.toggle('active', t === tab);
    });
    document.getElementById('panel-profile').classList.remove('active');
  }

  // ══════════════════════════════════════
  // OTP FLOW
  // ══════════════════════════════════════
  function sendOTP(mode) {
    const phone = document.getElementById(`${mode}-phone`).value.trim();

    if (mode === 'register') {
      const name = document.getElementById('register-name').value.trim();
      if (!name) { showStatus('register', 'error', '⚠️ कृपया अपना नाम डालें।'); return; }
    }

    if (!phone || phone.length !== 10) {
      showStatus(mode, 'error', '⚠️ कृपया 10 अंकों का valid मोबाइल नंबर डालें।');
      return;
    }

    // Show OTP step
    document.getElementById(`${mode}-step-${mode === 'login' ? 'phone' : 'details'}`).style.display = 'none';
    document.getElementById(`${mode}-step-otp`).style.display = 'block';

    if (mode === 'register') {
      document.getElementById('register-phone-display').textContent = '+91 ' + phone;
    }

    showStatus(mode, 'info', `📲 OTP +91 ${phone} पर भेजा जा रहा है...`);

    // Simulate OTP send (replace with real API call)
    setTimeout(() => {
      showStatus(mode, 'success', '✅ OTP भेजा गया! (Demo: 123456)');
      startResendTimer(mode);
    }, 1000);
  }

  function verifyOTP(mode) {
    const otp = document.getElementById(`${mode}-otp`).value.trim();

    if (!otp || otp.length !== 6) {
      showStatus(mode, 'error', '⚠️ कृपया 6 अंकों का OTP डालें।');
      return;
    }

    showStatus(mode, 'info', '🔄 Verify हो रहा है...');

    // Simulate verification (replace with real API)
    setTimeout(() => {
      if (otp === '123456' || otp.length === 6) { // demo: any 6-digit OTP works
        const phone = document.getElementById(`${mode}-phone`).value;
        const name  = mode === 'register'
                        ? document.getElementById('register-name').value
                        : ('किसान ' + phone.slice(-4));
        const state = mode === 'register'
                        ? (document.getElementById('register-state').value || '—')
                        : '—';
        const crop  = mode === 'register'
                        ? (document.getElementById('register-crop').value || '—')
                        : '—';

        currentUser = { name, phone: '+91 ' + phone, state, crop };
        localStorage.setItem('km_user', JSON.stringify(currentUser));

        showStatus(mode, 'success', '✅ Login सफल! स्वागत है ' + name + ' जी 🙏');
        setTimeout(showProfilePanel, 900);
      } else {
        showStatus(mode, 'error', '❌ OTP गलत है। कृपया दोबारा डालें।');
      }
    }, 800);
  }

  function resendOTP(mode) {
    showStatus(mode, 'info', '📲 OTP दोबारा भेजा जा रहा है...');
    setTimeout(() => {
      showStatus(mode, 'success', '✅ नया OTP भेजा गया! (Demo: 123456)');
      startResendTimer(mode);
    }, 700);
  }

  function startResendTimer(mode) {
    const btn   = document.getElementById(`${mode}-resend-btn`);
    const timer = document.getElementById(`${mode}-resend-timer`);
    btn.disabled = true;
    let secs = 30;
    clearInterval(resendTimers[mode]);
    resendTimers[mode] = setInterval(() => {
      secs--;
      if (timer) timer.textContent = secs;
      if (secs <= 0) {
        clearInterval(resendTimers[mode]);
        btn.disabled = false;
        btn.innerHTML = 'दोबारा भेजें';
      }
    }, 1000);
  }

  function backToPhone(mode) {
    if (mode === 'login') {
      document.getElementById('login-step-otp').style.display = 'none';
      document.getElementById('login-step-phone').style.display = 'block';
    } else {
      document.getElementById('register-step-otp').style.display = 'none';
      document.getElementById('register-step-details').style.display = 'block';
    }
    hideStatus(mode);
  }

  // ══════════════════════════════════════
  // SOCIAL LOGIN
  // ══════════════════════════════════════
  function googleLogin() {
    showStatus('login', 'info', '🌐 Google Login जल्द आएगा...');
  }

  function guestLogin() {
    currentUser = { name: 'Guest किसान', phone: '—', state: '—', crop: '—', guest: true };
    localStorage.setItem('km_user', JSON.stringify(currentUser));
    showStatus('login', 'success', '✅ Guest के रूप में जारी रख रहे हैं।');
    setTimeout(showProfilePanel, 700);
  }

  // ══════════════════════════════════════
  // PROFILE
  // ══════════════════════════════════════
  function showProfilePanel() {
    if (!currentUser) return;
    // Hide tabs
    document.getElementById('modal-tabs').style.display = 'none';

    const cropNames = { gehu:'गेहूँ', dhaan:'धान', ganna:'गन्ना', sarson:'सरसों', aloo:'आलू', other:'अन्य', '—':'—' };
    const stateNames = { UP:'Uttar Pradesh', MP:'Madhya Pradesh', RJ:'Rajasthan', HR:'Haryana', PB:'Punjab', BR:'Bihar', MH:'Maharashtra', KA:'Karnataka', GJ:'Gujarat', OTHER:'अन्य', '—':'—' };

    document.getElementById('profile-name-display').textContent  = currentUser.name  || '—';
    document.getElementById('profile-phone-display').textContent = currentUser.phone || '—';
    document.getElementById('profile-state-display').textContent = stateNames[currentUser.state] || currentUser.state || '—';
    document.getElementById('profile-crop-display').textContent  = cropNames[currentUser.crop]   || currentUser.crop  || '—';

    ['login','register','profile'].forEach(p => {
      document.getElementById(`panel-${p}`).classList.toggle('active', p === 'profile');
    });
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('km_user');
    document.getElementById('modal-tabs').style.display = 'flex';
    switchTab('login');
    // Reset forms
    ['login-phone','login-otp','register-name','register-phone','register-otp'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    ['login-step-otp','register-step-otp'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    document.getElementById('login-step-phone').style.display   = 'block';
    document.getElementById('register-step-details').style.display = 'block';
  }

  // ══════════════════════════════════════
  // STATUS MESSAGES
  // ══════════════════════════════════════
  function showStatus(mode, type, msg) {
    const el = document.getElementById(`${mode}-status`);
    if (!el) return;
    el.className = `form-status ${type}`;
    el.textContent = msg;
  }
  function hideStatus(mode) {
    const el = document.getElementById(`${mode}-status`);
    if (el) el.className = 'form-status';
  }

  // ══════════════════════════════════════
  // MODAL OPEN/CLOSE (for embedded use)
  // ══════════════════════════════════════
  function closeModal() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) {
      closeModal();
    }
  }

  // Expose for external use (when included as iframe or script)
  window.openLoginModal = function() {
    document.getElementById('modal-overlay').style.display = 'flex';
  };
  window.closeLoginModal = function() {
    document.getElementById('modal-overlay').style.display = 'none';
  };
</script>

</body>
</html>
