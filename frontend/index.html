<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KrashiMitra — किसान का डिजिटल साथी | ರೈತನ ಡಿಜಿಟಲ್ ಸಂಗಾತಿ</title>

  <meta name="description"
    content="KrashiMitra — AI Krishi Sahayak for farmers. Mandi bhav, weather, fertilizer advice, crop disease detection. ರೈತರ AI ಕೃಷಿ ಸಹಾಯಕ. ಮಂಡಿ ಬೆಲೆ, ಹವಾಮಾನ, ಗೊಬ್ಬರ ಸಲಹೆ.">

  <meta name="robots" content="index, follow">

  <!-- Canonical is root -->
  <link rel="canonical" href="https://krashimitra.in/">

  <!-- hreflang — the key tags Google uses -->
  <link rel="alternate" hreflang="hi"        href="https://krashimitra.in/hi/">
  <link rel="alternate" hreflang="kn"        href="https://krashimitra.in/kn/">
  <link rel="alternate" hreflang="en"        href="https://krashimitra.in/">
  <link rel="alternate" hreflang="x-default" href="https://krashimitra.in/">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #1b5e20;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 12px;
    }
    .logo { font-size: 48px; }
    .msg  { color: #fff; font-size: 16px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="logo">🌾कृषि मित्र</div>
  <div class="msg" id="msg">Loading KrashiMitra…</div>
  <link rel="icon" type="image/png" href="/frontend/images/favicon.png">

  <script>
    // Detect browser language and redirect accordingly
    // Falls back to Hindi if language not detected
    (function () {
      var lang = (navigator.language || navigator.userLanguage || 'hi').toLowerCase();

      // Kannada speakers: kn, kn-in
      if (lang === 'kn' || lang.startsWith('kn-')) {
        document.getElementById('msg').textContent = 'ನಿಮ್ಮ ಪುಟ ತೆರೆಯುತ್ತಿದೆ…';
        window.location.replace('https://krashimitra.in/kn/');
        return;
      }

      // Hindi speakers: hi, hi-in
      if (lang === 'hi' || lang.startsWith('hi-')) {
        document.getElementById('msg').textContent = 'आपका पेज खुल रहा है…';
        window.location.replace('https://krashimitra.in/hi/');
        return;
      }

      // English or any other language → Hindi as default
      document.getElementById('msg').textContent = 'Redirecting…';
      window.location.replace('https://krashimitra.in/hi/');
    })();
  </script>

  <!-- Fallback links if JS is disabled -->
  <noscript>
    <p style="color:white">
      Choose your language:<br><br>
      <a href="/hi/" style="color:#a5d6a7">हिंदी</a> &nbsp;|&nbsp;
      <a href="/kn/" style="color:#a5d6a7">ಕನ್ನಡ</a>
    </p>
  </noscript>
</body>
</html>
