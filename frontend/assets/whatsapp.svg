<!--
  WhatsApp glyph, served from our own origin.

  Six places (shop.html x5, krashibook.js x1) used to hotlink
  upload.wikimedia.org/.../WhatsApp.svg for this icon. That pulled a Meta
  trademark through Wikimedia's bandwidth on every render, and the mark
  could change or move without notice. Drawn locally instead: one asset,
  no third-party request, and the usage stays plain nominative use — it
  labels a link that really does open WhatsApp.
-->
