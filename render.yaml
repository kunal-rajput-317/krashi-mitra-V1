# ============================================================
# render.yaml — KrashiMitra backend (Infrastructure as Code)
#
# Until now the build and start commands lived only in Render's dashboard:
# undocumented, unversioned, and impossible to review. This file makes the
# deploy reproducible and diffable. Render picks it up automatically from the
# repo root ("Blueprint"); an existing service keeps running and adopts these
# settings on the next sync.
#
# SECRETS ARE NOT IN THIS FILE. Every sensitive var is declared with
# `sync: false`, which tells Render "this exists, but read the value from the
# dashboard" — so the names are documented in the repo while the values stay
# out of it.
# ============================================================

services:
  - type: web
    name: krashi-mitra-v1
    runtime: python
    plan: free
    region: singapore          # closest Render region to the user base
    branch: main

    buildCommand: pip install -r requirements.txt

    # main.py at the repo root re-exports backend.main:app for exactly this.
    # $PORT is injected by Render and must be honoured or the deploy is
    # marked unhealthy.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # DB-free liveness probe. Must stay DB-free: a Neon cold start would
    # otherwise make a healthy dyno look down.
    healthCheckPath: /health

    autoDeploy: true

    envVars:
      # ── Runtime behaviour ───────────────────────────────────
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "false"          # disables uvicorn --reload in __main__
      - key: LOG_LEVEL
        value: INFO
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"

      # ── AI pipeline toggles ─────────────────────────────────
      # The embedding model (sentence-transformers) plus ChromaDB is the
      # single largest memory consumer on a 512 MB free dyno. Flip these to
      # "false" to drop the whole torch stack and fall back to fuzzy text
      # cache matching — see backend/main.py::_warm_up_models.
      - key: CACHE_SEMANTIC_ENABLED
        value: "false"
      - key: RAG_ENABLED
        value: "false"
      - key: AI_RESPONSE_ENABLED
        value: "false"

      # ── Secrets — values set in the Render dashboard ────────
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false          # optional
      - key: GEMINI_API_KEY
        sync: false
      # Spare Gemini keys — each one is another free daily quota, tried in
      # order when the one before it returns 429. Any GEMINI_API_KEY<n> the
      # dashboard has is picked up automatically; nothing in code lists them.
      - key: GEMINI_API_KEY2
        sync: false          # optional
      - key: GEMINI_API_KEY3
        sync: false          # optional
      - key: GEMINI_API_KEY4
        sync: false          # optional
      - key: GEMINI_API_KEY5
        sync: false          # optional
      - key: GEMINI_MODEL
        sync: false          # optional
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false          # optional
      - key: SMTP_PASSWORD
        sync: false          # optional
      - key: SMTP_PORT
        sync: false          # optional
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DB_ALERT_EMAIL
        sync: false          # optional
      - key: MANDI_ARCHIVE_REPO
        sync: false          # optional
      - key: MANDI_ARCHIVE_TOKEN
        sync: false          # optional
      - key: CORS_ORIGINS
        sync: false          # optional

      # ── Listing media (Cloudflare R2) ───────────────────────
      # Where a farmer's crop photo lives. Render's disk is ephemeral, so
      # before this every bazar photo was a 404 by the next redeploy — all
      # three that existed on 14 Sep 2026 were already gone. R2 was chosen over
      # Postgres (a crop photo is read on every feed render, and Neon's metered
      # compute is the tightest ceiling here) and over the origin disk (Render
      # meters 5 GB/month of egress and suspended the workspace over it on
      # 17 Aug 2026; R2 egress is free and never touches that meter).
      #
      # All five must be set together — with any one missing the backend falls
      # back to the local disk, which is correct for `uvicorn` offline and
      # wrong for production. backend/services/media_store.py has the full
      # setup, including the one bucket setting that is not an env var: a CORS
      # rule allowing GET from https://krashimitra.in, without which the
      # WhatsApp share card cannot draw a listing photo onto its canvas.
      #
      #   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
      #       dash.cloudflare.com → R2 → Account ID, then
      #       Manage API tokens → Create → Object Read & Write
      #   R2_BUCKET         the bucket name, e.g. krashimitra-media
      #   R2_PUBLIC_BASE    its public host, no trailing slash — a custom
      #                     domain (https://media.krashimitra.in) or the
      #                     https://pub-<hash>.r2.dev address
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false
      - key: R2_ENDPOINT
        sync: false          # optional — overrides the S3 endpoint
      # CLOUDFLARE_API_TOKEN is a DIFFERENT credential from the R2 keys above,
      # and the confusion is easy to make: on Cloudflare's token screen the
      # value for this one is the "Token value", while for R2 it is the Access
      # Key ID / Secret shown underneath it. Only this token can read the
      # GraphQL analytics, so without it /admin/infra shows R2's storage (which
      # it counts with the S3 keys) but not the monthly Class A / Class B
      # operation allowances. Photos upload fine either way — this buys the
      # warning before the month's 1M writes run out, not the writes.
      #   My Profile → API Tokens → Create Token, permissions:
      #   Account · Account Analytics · Read  +  Account · Workers R2 Storage · Read
      - key: CLOUDFLARE_API_TOKEN
        sync: false          # optional — R2 operation meters on /admin/infra
      # UPI listing-fee collection (services/upi.py). KM_UPI_ID is the
      # destination of real money, so it is never committed — an out-of-date or
      # mistyped VPA in git would silently route a dealer's ₹500 to a stranger.
      # Unset, every payment surface says "not configured" rather than guess.
      # KM_UPI_NAME must match the name on the receiving account closely enough
      # that a trader recognises it on his confirmation screen.
      - key: KM_UPI_ID
        sync: false          # optional
      - key: KM_UPI_NAME
        sync: false          # optional
      # Listing fee in whole rupees. Optional — services/upi.py defaults to 500.
      - key: KM_LISTING_FEE
        sync: false          # optional
      # Blue tick = कृषि मित्र प्रीमियम (services/seller_verify.py). Changed
      # 2026-09-18: it is a paid membership, not a phone check, so the badge is
      # granted the moment ₹ मिला is pressed in /admin → नीला टिक. Two plans,
      # each with a struck anchor price: ₹399 ₹199 for 1 month and ₹699 ₹499
      # for 3. All four figures are optional and default to those numbers.
      #
      # Env rather than literals for the same reason as the listing fee — the
      # first real negotiation may not land on ₹199, and re-deploying to change
      # a price is the manual seam this project bans. There is deliberately no
      # struck-price ("MRP") variable any more: a crossed-out price nobody ever
      # paid is a false reference price under the CCPA dark-pattern guidelines.
      # Search clicks/day the sponsor rate card was priced for — the baseline
      # the daily price-review email measures growth against. Private: this
      # repo is public and Search Console figures must not be. Unset = no review.
      - key: KM_SPONSOR_BASE_CLICKS
        sync: false
      - key: KM_VERIFY_M1_PRICE
        sync: false          # optional — 1-month price, default 199
      - key: KM_VERIFY_M3_PRICE
        sync: false          # optional — 3-month price, default 499
      # Legacy single-price variable. Still honoured — it only ever meant the
      # monthly rate, so it overrides KM_VERIFY_M1_PRICE's default and nothing
      # else. KM_VERIFY_MONTHS is retired: the term comes from the plan the
      # farmer picked, not from the environment.
      - key: KM_VERIFY_FEE
        sync: false          # optional — whole rupees, monthly plan

      # ── Free-tier runway (admin panel → Infra & Credits) ────
      # Read-only billing API tokens for the three free plans the site runs
      # on. All optional: without one, that provider's card says exactly which
      # variable is missing and where to create the key, and the panel still
      # works. Neon's storage and write-canary figures need NO token at all —
      # they come straight out of Postgres.
      #
      # Why these exist: every outage this site has had was a quota outage.
      # Netlify's usage cap 503'd every URL on 11 Aug while Render stayed
      # perfectly healthy, and Neon flips its compute read-only at the storage
      # cap while its own dashboard still reports "All OK". /health cannot
      # surface any of it — it is forbidden from calling a third-party API.
      #
      #   NETLIFY_AUTH_TOKEN  app.netlify.com → User settings → Applications
      #                       → Personal access tokens
      #   RENDER_API_KEY      dashboard.render.com → Account settings → API Keys
      #   NEON_API_KEY        console.neon.tech → Account settings → API keys
      #
      # Optional companions, only needed when the account holds more than one
      # of a thing and auto-discovery would pick the wrong one:
      #   NETLIFY_ACCOUNT_SLUG, NETLIFY_SITE_ID, RENDER_SERVICE_ID,
      #   NEON_PROJECT_ID
      # And the plan allowances, if a plan is ever upgraded (defaults are the
      # free-tier numbers): NETLIFY_BANDWIDTH_GB, NETLIFY_BUILD_MINUTES,
      #   RENDER_BANDWIDTH_GB, RENDER_INSTANCE_HOURS, NEON_COMPUTE_HOURS,
      #   NEON_TRANSFER_GB, INFRA_WARN_PCT
      - key: NETLIFY_AUTH_TOKEN
        sync: false          # optional
      - key: RENDER_API_KEY
        sync: false          # optional
      - key: NEON_API_KEY
        sync: false          # optional
