[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q keeps the default run readable; add -v when chasing a specific failure.
addopts = -q --strict-markers

# The app still uses @app.on_event (deprecated in FastAPI) and utcnow()
# (deprecated in 3.12+). Both are pre-existing and unrelated to what the
# tests assert, so silence them rather than let real warnings get lost in
# the noise. Remove these once the underlying calls are migrated.
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore:.*on_event is deprecated.*:DeprecationWarning
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*
